<script>


function isPalindrome(str){

    for(let i = 0; i < str.length; i++){
        const start = str[i];
        const end = str[(str.length - 1 - i)];

        console.log(start, end);
        
        if(start !== end){
            return false;
        }

    }

    return true;

}


const isPal = isPalindrome('abcba');
console.log(isPal);



</script>
